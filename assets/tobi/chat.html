<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TOBi chat: why is my bill higher?</title>
<!-- The phone in the "TOBi, again" carousel (12 October 2026). Built from the TOBi generative prototype,
     mobile view only. The page around it calls window.tobiDemo.go(step) to move the conversation on;
     each step adds its messages one at a time, unless reduced motion is set. -->
<style>
  @font-face { font-family: VodafoneDemo; src: url(vodafone-400.ttf) format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: VodafoneDemo; src: url(vodafone-700.ttf) format("truetype"); font-weight: 700; font-display: swap; }

  :root {
    color-scheme: light;
    --vf-red: #E60000;
    --vf-red-press: #BD0000;
    --slate: #4A4D4E;
    --ink: #333333;
    --muted: #666666;
    --faint: #6B6B6B;
    --hairline: #EBEBEB;
    --canvas: #F4F4F4;
    --line: #E4E4E4;
    --white: #FFFFFF;
    --purple: #9C2AA0;
    --green: #428600;
    --yellow: #FECB00;
    --font: VodafoneDemo, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--white); }
  body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }

  /* The phone is drawn at 375px wide and zoomed to fit the frame it sits in. */
  .scaler { width: 375px; transform-origin: top left; }
  .frame { width: 375px; background: var(--white); overflow: hidden; display: flex; flex-direction: column; }
  /* Nothing in the phone is clickable: the carousel around it moves the conversation on. */
  .frame button, .frame input { pointer-events: none; }

  /* Light chrome: one white block for the status bar and header (so no seam shows when the phone is scaled),
     with red kept for TOBi's face and for actions. */
  .top { background: var(--white); flex: 0 0 auto; border-bottom: 1px solid var(--line); }
  .statusbar {
    height: 20px; color: var(--ink); flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px; padding: 0 10px; font: 400 12px/16px var(--font);
  }
  .statusbar .mid { flex: 1; text-align: center; }
  .statusbar .end { text-align: right; }
  .chat-header {
    color: var(--ink); flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px; padding: 4px 12px 10px; height: 74px;
  }
  .chat-header .who { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .chat-header .name { font: 700 18px/22px var(--font); }
  .chat-header .sub { font: 400 13px/16px var(--font); color: var(--muted); margin-top: 2px; }

  .thread {
    flex: 1; min-height: 0; overflow-y: auto; background: var(--canvas);
    padding: 12px 10px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none;
  }
  .thread::-webkit-scrollbar { display: none; }
  .thread::before { content: ""; margin-top: auto; }
  .row { display: flex; gap: 6px; align-items: flex-end; }
  .row.me { justify-content: flex-end; }
  .stack { display: flex; flex-direction: column; gap: 3px; max-width: 78%; }
  .row.me .stack { align-items: flex-end; }
  .bubble {
    background: var(--white); border-radius: 18px 18px 18px 6px; padding: 10px 15px;
    font: 400 18px/24px var(--font); color: var(--ink); overflow-wrap: anywhere;
  }
  .row.me .bubble { background: var(--slate); color: var(--white); border-radius: 18px 18px 6px 18px; }
  .meta { display: inline-flex; align-items: center; gap: 4px; font: 400 14px/18px var(--font); color: var(--muted); }
  .typing {
    background: var(--white); border-radius: 18px 18px 18px 6px; padding: 13px 15px;
    display: inline-flex; gap: 5px; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #9A9A9A; display: block; animation: typing-dot 1.3s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes typing-dot { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  /* The newest message rises into place, so it's clear what just happened. */
  @keyframes msg-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .row.enter { animation: msg-in .38s cubic-bezier(.2, .75, .25, 1) both; }

  .notice {
    background: var(--white); border: 1px solid #F2D3D3; border-radius: 16px;
    padding: 10px 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .notice .tag {
    display: flex; align-items: center; gap: 5px;
    font: 700 11px/14px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--vf-red);
  }
  .notice .tag b { width: 5px; height: 5px; border-radius: 50%; background: var(--vf-red); display: block; }
  .notice .tag .t { margin-left: auto; font: 400 11px/14px var(--font); letter-spacing: 0; text-transform: none; color: var(--faint); }
  .notice p { margin: 0; font: 400 14px/19px var(--font); color: var(--ink); }

  .card { background: var(--white); border-radius: 16px; border: 1px solid var(--line); overflow: hidden; width: 280px; max-width: 100%; }
  .card .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .card .rule { height: 1px; background: var(--hairline); display: block; }
  .card h4 { margin: 0; font: 700 16px/22px var(--font); color: var(--ink); }
  .card p { margin: 0; font: 400 14px/20px var(--font); color: var(--muted); }
  .card .src { font: 400 12px/16px var(--font); color: var(--muted); }
  .card-link {
    appearance: none; background: transparent; border: 0; width: 100%; text-align: left;
    display: block; font: 700 16px/22px var(--font); color: var(--vf-red); padding: 10px 14px;
  }
  .card-cta {
    appearance: none; border: 0; width: 100%; display: block;
    background: var(--vf-red); color: var(--white); font: 700 16px/22px var(--font); text-align: center; padding: 11px 14px;
  }
  .card-cta.done { background: var(--green); }
  .wait { display: inline-flex; align-items: center; gap: 6px; font: 400 14px/18px var(--font); color: var(--muted); }
  .wait i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); display: block; }

  .found-row { display: grid; grid-template-columns: 22px 1fr; gap: 2px 10px; align-items: start; padding: 6px 0; }
  .found-row + .found-row { border-top: 1px solid var(--hairline); }
  .found-row .amt { font: 700 16px/22px var(--font); color: var(--ink); }
  .found-row p, .found-row .sure { grid-column: 2; }
  .sure { display: inline-flex; align-items: center; gap: 6px; font: 700 12px/16px var(--font); color: var(--green); margin-top: 2px; }
  .sure i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: block; }
  .sure.unsure { color: #7A5F00; }
  .sure.unsure i { background: var(--yellow); }
  .q-mark { width: 22px; height: 22px; border-radius: 50%; background: var(--yellow); color: var(--ink); display: grid; place-items: center; font: 700 14px/1 var(--font); }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-top: 1px solid var(--hairline); margin: 0; }
  .kv dt { font: 400 14px/20px var(--font); color: var(--muted); }
  .kv dd { margin: 0; text-align: right; font: 700 16px/22px var(--font); color: var(--ink); }
  .kv dd small { display: block; font: 400 12px/16px var(--font); color: var(--muted); }
  .choice { display: flex; gap: 6px; }
  .choice span {
    flex: 1; background: var(--white); border: 1px solid #CCCCCC; border-radius: 10px; padding: 7px 10px;
    font: 700 14px/18px var(--font); color: var(--ink);
  }
  .choice span.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .choice small { display: block; font: 400 12px/16px var(--font); color: var(--muted); }
  .share { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .share li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font: 400 14px/19px var(--font); color: var(--ink); }
  .share .box { width: 16px; height: 16px; margin-top: 2px; border-radius: 3px; background: var(--vf-red); display: grid; place-items: center; }
  .share .box svg { display: block; }

  /* Shows its working: what TOBi is checking, then a short line saying it's done. */
  .work { display: inline-flex; align-items: center; gap: 7px; padding: 2px 4px; font: 400 13px/18px var(--font); color: var(--muted); }
  .work .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #CFCFCF; border-top-color: var(--vf-red); animation: spin .8s linear infinite; }
  .work.done .spin { display: none; }
  .work .ok { display: none; }
  .work.done .ok { display: flex; }
  .work.doing .label {
    background: linear-gradient(90deg, var(--muted) 0%, var(--muted) 35%, #B5B5B5 50%, var(--muted) 65%, var(--muted) 100%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 1.4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shimmer { from { background-position: 110% 0; } to { background-position: -110% 0; } }
  /* Replies stream in word by word, with a caret while TOBi is still writing. */
  .bubble.streaming::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--vf-red); }

  /* The adviser's name over their messages. Called .agent-name, not .who, so it can't
     restyle the TOBi name in the header (that clash turned the header text grey). */
  .row.agent .bubble { box-shadow: inset 3px 0 0 var(--purple); }
  .agent-name { font: 700 12px/16px var(--font); color: var(--muted); padding-left: 2px; }

  .quick {
    flex: 0 0 auto; display: flex; flex-wrap: nowrap; gap: 8px; min-height: 46px;
    padding: 0 10px 10px; background: var(--canvas); overflow: hidden;
  }
  .quick span {
    flex: 0 0 auto; white-space: nowrap; background: var(--white); border-radius: 18px;
    border: 2px solid #F0C8C8; padding: 6px 14px; font: 400 14px/18px var(--font); color: var(--vf-red);
  }
  .composer {
    height: 58px; background: var(--white); flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px; padding: 0 12px; box-shadow: 0 -1px 0 var(--line);
  }
  .composer .input {
    flex: 1; min-width: 0; height: 40px; border-radius: 20px; background: var(--canvas);
    padding: 0 16px; font: 400 17px/40px var(--font); color: var(--muted);
  }
  .send { width: 36px; height: 36px; border-radius: 50%; background: var(--vf-red); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }

  .face-vid { position: relative; width: 56px; height: 56px; overflow: hidden; flex: 0 0 auto; display: block; background: var(--white); }
  .face-vid video { position: absolute; display: block; max-width: none; }
  .face-vid .face { position: absolute; left: 5px; top: 4px; }
  .face-vid canvas { position: absolute; inset: 0; width: 56px; height: 56px; opacity: 0; pointer-events: none; }
  .face { display: block; }
  .face svg { width: 100%; height: 100%; display: block; overflow: visible; transform-box: view-box; }
  .face.plate { border-radius: 50%; background: var(--white); }
  /* TOBi's expressions move: these are the kit's own animations. */
  @keyframes tf-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.4%); } }
  @keyframes tf-tilt { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes tf-sway { 0%, 100% { transform: translateY(0) rotate(-2.4deg); } 50% { transform: translateY(-3%) rotate(2.4deg); } }
  @keyframes tf-slump { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(3%) rotate(1deg); } }
  @keyframes tf-nod { 0%, 8%, 62%, 100% { transform: translateY(0) rotate(0deg); } 22% { transform: translateY(6%) rotate(2deg); } 36% { transform: translateY(-1%) rotate(0deg); } 50% { transform: translateY(5%) rotate(1.5deg); } }
  @keyframes tf-giggle { 0%, 100% { transform: translateY(0) rotate(-2.6deg) scale(1); } 50% { transform: translateY(-3.4%) rotate(2.6deg) scale(1.02); } }
  @keyframes tf-pop { 0%, 100% { transform: scale(1) translateY(0); } 16% { transform: scale(1.09) translateY(-2%); } 42% { transform: scale(0.985) translateY(0); } }
  @keyframes tf-blink { 0%, 90%, 100% { transform: scaleY(1); } 94.5% { transform: scaleY(0.08); } }
  @keyframes tf-blink-slow { 0%, 82%, 100% { transform: scaleY(1); } 87% { transform: scaleY(0.1); } }
  @keyframes tf-wink { 0%, 52%, 76%, 100% { transform: scaleY(1); } 60%, 68% { transform: scaleY(0.3); } }
  @keyframes tf-squint { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.88); } }
  @keyframes tf-mouth-o { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12, 1.18); } }
  @keyframes tf-mouth-laugh { 0%, 100% { transform: scaleY(0.92); } 50% { transform: scaleY(1.1); } }
  @keyframes tf-note-a { 0% { transform: translate(-4px, 16px) scale(0.5); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(10px, -14px) scale(1.05) rotate(14deg); opacity: 0; } }
  @keyframes tf-note-b { 0% { transform: translate(6px, 18px) scale(0.5); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(-10px, -12px) scale(1.05) rotate(-14deg); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .row.enter, .typing i, .face svg, .face svg *, .work .spin, .work .label { animation: none !important; }
    .work.doing .label { color: var(--muted); background: none; }
  }
</style>
</head>

    h("div", { class: "chat-header" },
      headFace = h("span", { class: "face-vid", "aria-hidden": "true" }, faceStill, faceVideo, faceFade),
      h("span", { class: "who" }, h("span", { class: "name", text: "TOBi" }), h("span", { class: "sub", text: "AI assistant · can make mistakes" })),
      icon(ICON.close, 20))));
  var thread = h("div", { class: "thread", role: "log", "aria-label": "Conversation with TOBi" });
  var quick = h("div", { class: "quick", "aria-label": "Suggested replies" });
  frame.appendChild(thread);
  frame.appendChild(quick);
  frame.appendChild(h("div", { class: "composer", "aria-hidden": "true" },
    icon(ICON.plus, 24), icon(ICON.mic, 22), h("span", { class: "input", text: "Ask TOBi anything" }),
    h("span", { class: "send" }, icon(ICON.send, 20))));

  function fit() {
    var z = window.innerWidth / 375;
    scaler.style.transform = "scale(" + z + ")";
    frame.style.height = (window.innerHeight / z) + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  function rowFor(m, time, doing) {
    if (m.from === "work") {
      return h("div", { class: "row" }, h("span", { class: "work " + (doing ? "doing" : "done") },
        h("span", { class: "spin", "aria-hidden": "true" }), h("span", { class: "ok" }, icon(ICON.check, 14)),
        h("span", { class: "label", text: doing ? m.doing : m.done })));
    }
    if (m.notice) {
      return h("div", { class: "row" }, h("div", { class: "stack" }, h("div", { class: "notice" },
        h("span", { class: "tag" }, h("b"), m.notice, h("span", { class: "t", text: time })), h("p", { text: m.text }))));
    }
    if (m.card) return h("div", { class: "row" }, h("div", { class: "stack" }, CARDS[m.card]()));
    if (m.from === "agent") {
      return h("div", { class: "row agent" }, h("div", { class: "stack" },
        h("span", { class: "agent-name", text: m.name }), h("span", { class: "bubble", text: m.text })));
    }
    var stack = h("div", { class: "stack" }, h("span", { class: "bubble", text: m.text }));
    if (m.from === "me") {
      stack.appendChild(h("span", { class: "meta" }, time, icon(ICON.ticks, 17)));
      return h("div", { class: "row me" }, stack);
    }
    return h("div", { class: "row" }, stack);
  }

  // TOBi's expression in the header follows the conversation.
  function setFace(expr) {
    var i = CELLS.indexOf(expr);
    if (i < 0 || expr === faceNow) return;
    var was = CELLS.indexOf(faceNow);
    faceNow = expr;
    if (was >= 0 && faceVideo.readyState >= 2 && !reduce.matches) {
      var ctx = faceFade.getContext("2d");
      ctx.clearRect(0, 0, 124, 124);
      ctx.drawImage(faceVideo, 132.5 + 266.7 * (was % 6) - CELL_PX / 2, 114 + 211.3 * Math.floor(was / 6) - CELL_PX / 2, CELL_PX, CELL_PX, 0, 0, 124, 124);
      faceFade.style.transition = "none";
      faceFade.style.opacity = "1";
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        faceFade.style.transition = "opacity .6s ease";
        faceFade.style.opacity = "0";
      }); });
    }
    faceStill.innerHTML = faceSVG(expr, false, false);
    if (faceVideo.paused && !reduce.matches) faceVideo.play().catch(function () {});
    var k = FACE_PX / CELL_PX;
    var cx = 132.5 + 266.7 * (i % 6), cy = 114 + 211.3 * Math.floor(i / 6);
    faceVideo.style.left = (-(cx - CELL_PX / 2) * k) + "px";
    faceVideo.style.top = (-(cy - CELL_PX / 2) * k) + "px";
  }

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var timers = [];
  var run = 0;
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function toBottom() { thread.scrollTo({ top: thread.scrollHeight, behavior: reduce.matches ? "auto" : "smooth" }); }
  function showQuick(list) {
    quick.textContent = "";
    (list || []).forEach(function (q) { quick.appendChild(h("span", { text: q })); });
  }

  // Shows the conversation as it stands at the end of step n (0 to 5), adding that step's messages
  // one by one. done() is called once the last one is in.
  function lastFace(list) {
    for (var i = list.length - 1; i >= 0; i--) if (list[i].face) return list[i].face;
    return "idle 1";
  }

  function go(n, done, instant) {
    timers.forEach(clearTimeout); timers = [];
    var me = ++run;
    n = Math.max(0, Math.min(STEPS.length - 1, n));
    state = { confirmed: false, sent: false };
    var past = [GREETING];
    var i;
    for (i = 0; i < n; i++) past = past.concat(STEPS[i].msgs.map(function (m) { m.step = i; return m; }));
    for (i = 0; i <= n; i++) if (STEPS[i].set) Object.assign(state, STEPS[i].set);
    thread.textContent = "";
    past.forEach(function (m) { thread.appendChild(rowFor(m, TIMES[m.step || 0])); });
    var step = STEPS[n];
    var lastQuick = n ? STEPS.slice(0, n).reverse().find(function (s) { return s.quick; }) : null;
    var still = instant || reduce.matches;
    if (still) {
      step.msgs.forEach(function (m) { thread.appendChild(rowFor(m, TIMES[n])); });
      setFace(lastFace(past.concat(step.msgs)));
      showQuick(step.quick || []);
      thread.scrollTop = thread.scrollHeight;
      if (done) done();
      return;
    }
    // The previous step's quick replies stay up until the customer answers.
    showQuick(n === 0 ? ["Why is my bill higher?", "See latest bill", "Change my plan"] : (n && STEPS[n - 1].quick) || []);
    setFace(lastFace(past));
    thread.scrollTop = thread.scrollHeight;
    var t = 450;
    function add(row) {
      var typing = thread.querySelector(".typing-row");
      if (typing) typing.remove();
      row.classList.add("enter");
      thread.appendChild(row);
      toBottom();
      return row;
    }
    function dots() {
      thread.appendChild(h("div", { class: "row typing-row", "aria-hidden": "true" }, h("span", { class: "typing" }, h("i"), h("i"), h("i"))));
      toBottom();
    }
    step.msgs.forEach(function (m) {
      var guard = function (fn) { return function () { if (me === run) fn(); }; };
      if (m.from === "me") {
        later(guard(function () { showQuick([]); add(rowFor(m, TIMES[n])); }), t);
        t += 500;
      } else if (m.from === "work") {
        // What it's checking, then a short line saying it's done.
        var row;
        later(guard(function () { row = add(rowFor(m, TIMES[n], true)); setFace(m.face); }), t);
        t += 1300;
        later(guard(function () { row.replaceWith(rowFor(m, TIMES[n])); }), t);
        t += 250;
      } else if (m.from === "tobi" && m.text && !m.notice) {
        // TOBi writes its reply as it goes, word by word.
        var words = m.text.split(" ");
        var bubble;
        later(guard(dots), t);
        t += 450;
        later(guard(function () {
          var r = rowFor({ from: "tobi", face: m.face, text: "" }, TIMES[n]);
          bubble = r.querySelector(".bubble");
          bubble.classList.add("streaming");
          add(r);
          setFace(m.face);
        }), t);
        words.forEach(function (w, i) {
          later(guard(function () {
            bubble.textContent = words.slice(0, i + 1).join(" ");
            if (i === words.length - 1) bubble.classList.remove("streaming");
            thread.scrollTop = thread.scrollHeight;
          }), t + 60 + i * 55);
        });
        t += 60 + words.length * 55 + 350;
      } else if (m.from === "agent") {
        // A person types and sends a whole message, so the adviser keeps the typing dots.
        later(guard(dots), t);
        t += 1000;
        later(guard(function () { add(rowFor(m, TIMES[n])); }), t);
        t += 650;
      } else {
        later(guard(function () { add(rowFor(m, TIMES[n])); setFace(m.face); }), t);
        t += 650;
      }
    });
    later(function () { if (me !== run) return; showQuick(step.quick || []); if (done) done(); }, t);
  }

  function playFace() {
    if (reduce.matches) { faceVideo.pause(); faceVideo.currentTime = 0.5; }
    else faceVideo.play().catch(function () {});
  }
  reduce.addEventListener("change", playFace);
  // Browsers hold back video in a hidden tab, so try again whenever the page is shown or TOBi changes face.
  document.addEventListener("visibilitychange", function () { if (!document.hidden) playFace(); });
  faceVideo.addEventListener("canplay", playFace, { once: true });
  playFace();

  window.tobiDemo = { go: go, steps: STEPS.length };
  go(0, null, true);
  try { window.parent.postMessage("tobi-ready", location.origin); } catch (e) {}
})();
</script>
